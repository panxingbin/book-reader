# Gradle proxy settings (corporate proxy; HTTP CONNECT verified working)
systemProp.http.proxyHost=10.76.213.80
systemProp.http.proxyPort=808
systemProp.https.proxyHost=10.76.213.80
systemProp.https.proxyPort=808
systemProp.http.nonProxyHosts=localhost|127.0.0.1

# Compile Kotlin in the Gradle daemon. The out-of-process Kotlin compile daemon
# could not create its temp file under this sandbox (AccessDeniedException on
# ...\kotlin-daemon-client-*.tmp), so it is disabled here.
kotlin.compiler.execution.strategy=in-process

# ---------------------------------------------------------------------------
# THE plugin version. This is the single source of truth.
#
# Bump it here before packaging; `patchPluginXml` stamps it into the built
# plugin.xml, and the `checkPluginVersion` task fails the build if the literal in
# src/main/resources/META-INF/plugin.xml has drifted away from it.
# ---------------------------------------------------------------------------
pluginVersion=3.7.0
